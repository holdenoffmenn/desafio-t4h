[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banco-agil"
version = "0.1.0"
description = "Agente Bancário Inteligente — Banco Ágil"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "filelock>=3.15",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "langchain-core>=0.3",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.37",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
]
observability = [
    "langfuse>=4.0",
]
# Provedores de LLM — instale apenas o(s) que for usar (LLM_PROVIDER no .env).
llm-gemini = [
    "langchain-google-genai>=2.0",
]
llm-groq = [
    "langchain-groq>=0.2",
]
# langchain-openai cobre tanto OpenAI quanto OpenRouter (endpoint compatível).
llm-openai = [
    "langchain-openai>=0.2",
]
llm-together = [
    "langchain-together>=0.3",
]
llm-all = [
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.2",
    "langchain-openai>=0.2",
    "langchain-together>=0.3",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/banco_agil"]

[tool.hatch.build.targets.wheel.sources]
"src/banco_agil" = "banco_agil"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["banco_agil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["banco_agil"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportPrivateUsage = false
reportUnnecessaryIsInstance = false
